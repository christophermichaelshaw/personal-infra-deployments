services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    deploy:
#      placement:
#        constraints:
#          - node.role == manager
#          - node.hostname==${constraint_node_hostname}
      labels:
        traefik.enable: ${TRAEFIK_ENABLE}
        traefik.swarm.network: ${TRAEFIK_SWARM_NETWORK}
        traefik.tcp.routers.vaultwarden_postgres.rule: ${TRAEFIK_TCP_ROUTERS_VAULTWARDEN_POSTGRES_RULE}
        traefik.tcp.services.vaultwarden_postgres.loadbalancer.server.port: ${TRAEFIK_TCP_SERVICES_VAULTWARDEN_POSTGRES_LOADBALANCER_SERVER_PORT}
        traefik.tcp.routers.vaultwarden_postgres.entrypoints: ${TRAEFIK_TCP_ROUTERS_VAULTWARDEN_POSTGRES_ENTRYPOINTS}
        traefik.tcp.routers.vaultwarden_postgres.tls: ${TRAEFIK_TCP_ROUTERS_VAULTWARDEN_POSTGRES_TLS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
#    expose:
#      - "5432"
#      timeout: 5s
#    ports:
#      - 5432:5432
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${VAULTWARDEN_POSTGRES_DATA_VOLUME}:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DB: ${PG_DB}
      TZ: ${TZ}
    labels:
      wud.watch: "true"
      wud.tag.include: '^(0|[1-9]\d*)-alpine$$'
      wud.watch.digest: "true"
    networks:
      - vaultwarden

  vaultwarden:
    image: vaultwarden/server:latest
    deploy:
#      placement:
#        constraints:
#          - node.role == manager
#          - node.hostname==${constraint_node_hostname}
      labels:
        traefik.enable: ${TRAEFIK_ENABLE}
        traefik.swarm.network: ${TRAEFIK_SWARM_NETWORK}
        traefik.http.routers.bitwarden.rule: ${TRAEFIK_HTTP_ROUTERS_BITWARDEN_RULE}
        traefik.http.routers.bitwarden.entrypoints: ${TRAEFIK_HTTP_ROUTERS_BITWARDEN_ENTRYPOINTS}
        traefik.http.routers.bitwarden.tls: ${TRAEFIK_HTTP_ROUTERS_BITWARDEN_TLS}
        traefik.http.services.bitwarden.loadbalancer.server.port: ${TRAEFIK_HTTP_SERVICES_BITWARDEN_LOADBALANCER_SERVER_PORT}
        traefik.http.routers.bitwarden.service: ${TRAEFIK_HTTP_ROUTERS_BITWARDEN_SERVICE}
        traefik.http.routers.bitwarden-admin.rule: ${TRAEFIK_HTTP_ROUTERS_BITWARDEN_ADMIN_RULE}
        traefik.http.routers.bitwarden-admin.entrypoints: ${TRAEFIK_HTTP_ROUTERS_BITWARDEN_ADMIN_ENTRYPOINTS}
        traefik.http.routers.bitwarden-admin.priority: ${TRAEFIK_HTTP_ROUTERS_BITWARDEN_ADMIN_PRIORITY}
        traefik.http.routers.bitwarden-admin.middlewares: ${TRAEFIK_HTTP_ROUTERS_BITWARDEN_ADMIN_MIDDLEWARES}
        traefik.http.middlewares.bitwarden-admin-ipallowlist.ipallowlist.sourcerange: ${TRAEFIK_HTTP_MIDDLEWARES_BITWARDEN_ADMIN_IPALLOWLIST_SOURCERANGE}
        traefik.http.middlewares.bitwarden-admin-ipallowlist.ipallowlist.ipstrategy.depth: ${TRAEFIK_HTTP_MIDDLEWARES_BITWARDEN_ADMIN_IPALLOWLIST_IPSTRATEGY_DEPTH} 
    container_name: vaultwarden
    restart: always
#    ports:
#      - '7277:80'
#      - '3012:3012'
    environment:
      - WEBSOCKET_ENABLED=${VAULTWARDEN_WEBSOCKET_ENABLED}
      - WEBSOCKET_ADDRESS=${VAULTWARDEN_WEBSOCKET_ADDRESS}
      - WEBSOCKET_PORT=${VAULTWARDEN_WEBSOCKET_PORT}
      ## Enables push notifications (requires key and id from https://bitwarden.com/host)
      - PUSH_ENABLED=${VAULTWARDEN_PUSH_ENABLED}
      - PUSH_INSTALLATION_ID=${VAULTWARDEN_PUSH_INSTALLATION_ID}
      - PUSH_INSTALLATION_KEY=${VAULTWARDEN_PUSH_INSTALLATION_KEY}
      - PUSH_RELAY_URI=${VAULTWARDEN_PUSH_RELAY_URI}
      - PUSH_IDENTITY_URI=${VAULTWARDEN_PUSH_IDENTITY_URI}
      ## SMTP Settings
      - SMTP_HOST=${VAULTWARDEN_SMTP_HOST}
      - SMTP_PORT=465
      - SMTP_SECURITY=force_tls
      - SMTP_FROM=user@gmail.tld
      - SMTP_USERNAME=user@gmail.tld
      - SMTP_PASSWORD=Less-Secure-App-Passw0rd
      - TZ=${TZ}
      - DATABASE_URL=${VAULTWARDEN_DATABASE_URL}
      ## Vaultwarden SSO Settings for Authentik OAuth2/OIDC
      - DOMAIN=${VAULTWARDEN_DOMAIN}
      - SSO_ENABLED=${VAULTWARDEN_SSO_ENABLED}
      - SSO_AUTHORITY=${VAULTWARDEN_SSO_AUTHORITY}
      - SSO_SCOPES=${VAULTWARDEN_SSO_SCOPES}
      - SSO_CLIENT_ID=${VAULTWARDEN_SSO_CLIENT_ID}
      - SSO_CLIENT_SECRET=${VAULTWARDEN_SSO_CLIENT_SECRET}
      - SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION=${VAULTWARDEN_SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION}
      - SSO_CLIENT_CACHE_EXPIRATION=${VAULTWARDEN_SSO_CLIENT_CACHE_EXPIRATION}
      - SSO_ONLY=${VAULTWARDEN_SSO_ONLY}
      - SSO_SIGNUPS_MATCH_EMAIL=${VAULTWARDEN_SSO_SIGNUPS_MATCH_EMAIL}
    labels:
      - wud.watch=true
      - wud.tag.include=latest
      - wud.watch.digest=true
    networks:
      - vaultwarden
      - proxy
    volumes:
      - ${VAULTWARDEN_DATA_VOLUME}:/data

networks:
  proxy:
    external: true
  vaultwarden: