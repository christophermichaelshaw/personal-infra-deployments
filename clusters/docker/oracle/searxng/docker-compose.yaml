services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
#    ports:
#      - ${SEARXNG_HOST:+${SEARXNG_HOST}:}${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}
#    env_file: ./.env
    volumes:
      - ./core-config/:${CORE_CONFIG_VOLUME}:Z
      - core-data:${CORE_DATA_VOLUME}
    labels:
      traefik.enable: "true"
      traefik.tcp.routers.searxng.rule: ${TRAEFIK_HTTP_ROUTERS_SEARXNG_RULE}
      traefik.tcp.services.searxng.loadbalancer.server.port: ${TRAEFIK_HTTP_SERVICES_SEARXNG_LOADBALANCER_SERVER_PORT}
      traefik.tcp.routers.searxng.entrypoints: ${TRAEFIK_HTTP_ROUTERS_SEARXNG_ENTRYPOINTS}
      traefik.tcp.routers.searxng.tls: ${TRAEFIK_HTTP_ROUTERS_SEARXNG_TLS}

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:${VALKEY_DATA_VOLUME}

volumes:
  core-data:
  valkey-data: